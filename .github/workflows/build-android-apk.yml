name: Build Android APK

# COPA Downloader ka Android APK (Kivy + buildozer), ubuntu-22.04 par.
# python-for-android ko 2024.1.21 (Python 3.11) par pin kiya — naya p4a
# Python 3.14 build karta hai jiske saath Kivy 2.3.0 compile nahi hota.
# Pehli build ~30-45 min. Download: Actions -> run -> Artifacts -> COPA-Downloader-APK

on:
  push:
    branches:
      - claude/chicago-copa-downloader-jvwb19
    paths:
      - "android/**"
      - "copa-downloader/copa_downloader.py"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Core logic android/ me copy karo
        run: cp copa-downloader/copa_downloader.py android/copa_downloader.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Python build tools (stable combo)
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.36" virtualenv "buildozer==1.5.0" \
            "python-for-android==2024.1.21"

      - name: Pinned python-for-android source (2024.1.21 = Python 3.11)
        run: |
          python -m pip download "python-for-android==2024.1.21" \
            --no-deps --no-binary :all: -d /tmp/p4adl
          mkdir -p /tmp/p4a
          tar xzf /tmp/p4adl/*.tar.gz -C /tmp/p4a --strip-components=1
          # buildozer ko yehi p4a source use karne do (apna clone na kare)
          sed -i '/^requirements = /a p4a.source_dir = /tmp/p4a' android/buildozer.spec
          echo "----- buildozer.spec [app] head -----"
          grep -nE '^(requirements|p4a\.source_dir) =' android/buildozer.spec

      - name: Build APK
        working-directory: android
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COPA-Downloader-APK
          path: android/bin/*.apk
          if-no-files-found: error
