name: Build Android APK

# COPA Downloader ka Android APK (Kivy + buildozer), seedha ubuntu-22.04 par.
# Pehli build ~30-45 min (Android SDK/NDK + python/kivy compile).
# Download: repo -> Actions -> yeh run -> Artifacts -> COPA-Downloader-APK

on:
  push:
    branches:
      - claude/chicago-copa-downloader-jvwb19
    paths:
      - "android/**"
      - "copa-downloader/copa_downloader.py"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Core logic android/ me copy karo
        run: cp copa-downloader/copa_downloader.py android/copa_downloader.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Python build tools (stable combo — Python 3.11 wala p4a)
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.36" virtualenv \
            "buildozer==1.5.0" "python-for-android==2024.1.21"

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: android
        run: |
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer android debug || buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COPA-Downloader-APK
          path: android/bin/*.apk
          if-no-files-found: error
