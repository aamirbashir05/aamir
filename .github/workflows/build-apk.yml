name: Build Chakli APK

# chakli/ ya apk/ badalne par (ya manually) CHAKLI PAYMENTS ki Android APK banti hai
# aur GitHub Release "chakli-apk" mein upload ho jati hai.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/app-backup-data-preservation-sjup8y
      - main
    paths:
      - "chakli/**"
      - "apk/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: Copy web app into www
        run: |
          rm -rf apk/www && mkdir -p apk/www
          cp -r chakli/* apk/www/
          ls -la apk/www

      - name: Install Capacitor deps
        working-directory: apk
        run: npm install

      - name: Add Android platform
        working-directory: apk
        run: npx cap add android

      - name: Sync web assets + plugins
        working-directory: apk
        run: npx cap sync android

      - name: Apply custom launcher icons
        run: bash apk/apply-icons.sh

      - name: Build debug APK
        working-directory: apk/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk CHAKLI-PAYMENTS.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHAKLI-PAYMENTS-apk
          path: CHAKLI-PAYMENTS.apk
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view chakli-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create chakli-apk --repo "$GITHUB_REPOSITORY" \
              --title "CHAKLI PAYMENTS — Android App" \
              --notes "CHAKLI-PAYMENTS.apk download karke install karein. (Settings mein 'Unknown sources / is source se install' allow karna hoga.)"
          gh release upload chakli-apk CHAKLI-PAYMENTS.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK published to release 'chakli-apk'."
