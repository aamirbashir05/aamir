<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17181d">
  <title>Al Tariq Printers — Aap ka Hisaab</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <meta property="og:title" content="Al Tariq Printers — Aap ka Hisaab">
  <meta property="og:site_name" content="Al Tariq Printers">
  <meta property="og:description" content="Apna poora hisaab dekhein aur PDF download karein">
  <meta property="og:image" content="https://aamirbashir05.github.io/aamir/assets/icon-512.png">
  <meta property="og:type" content="website">
  <style>
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", system-ui, sans-serif;
      background: #f4ece0; color: #263140; margin: 0; padding: 0; line-height: 1.5;
    }
    .sheet { max-width: 720px; margin: 0 auto; background: #fffdf9; min-height: 100vh; box-shadow: 0 0 40px rgba(120,80,20,.10); }
    /* Design 5 letterhead: slate header + orange glow + gold shop name */
    .header {
      position: relative;
      background:
        radial-gradient(420px 170px at 100% 0, rgba(231,162,76,.24), transparent 60%),
        linear-gradient(160deg, #2b3039, #1b1f26);
      color: #fff; padding: 24px; display: flex; align-items: center; gap: 14px;
      border-bottom: 3px solid #e7a24c;
    }
    .header img.logo { height: 56px; width: auto; max-width: 84px; object-fit: contain; border-radius: 12px; }
    .header .htext { min-width: 0; }
    .header .shop { font-size: 23px; font-weight: 900;
      background: linear-gradient(180deg, #ffe0a3, #e7a24c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .header .sub { font-size: 13px; color: #cdd3db; margin-top: 2px; }
    .meta { padding: 18px 24px; border-bottom: 1px solid #eaddc8; display: flex; flex-wrap: wrap; gap: 6px 24px; }
    .meta div { font-size: 14px; }
    .meta .k { color: #9a7b45; }
    .meta b { color: #2a2005; }
    /* balance = orange 3D glossy tile */
    .balance {
      position: relative; overflow: hidden;
      margin: 20px 24px; padding: 20px; border-radius: 16px; text-align: center;
      background: linear-gradient(158deg, #ffd88f 0%, #f0ac4e 52%, #e2962f 100%);
      border: 1px solid rgba(255,235,190,.7);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 6px 0 rgba(150,85,20,.28), 0 14px 26px rgba(231,162,76,.28);
    }
    .balance::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%;
      background: linear-gradient(180deg, rgba(255,255,255,.30), transparent); pointer-events: none; }
    .balance .lbl { position: relative; z-index: 1; font-size: 14px; color: #6a4a12; font-weight: 700; }
    .balance .amt { position: relative; z-index: 1; font-size: 32px; font-weight: 900; margin-top: 4px; color: #3a2705; }
    .pos-t { color: #0b5a3d; } .neg-t { color: #8a2b1a; } .zero-t { color: #3a2705; }
    h3 { margin: 10px 24px 4px; font-size: 13px; color: #9a7b45; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
    .ttbl { margin: 0 10px 20px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { text-align: left; font-size: 11px; color: #7a5a1e; padding: 9px 4px; background: rgba(231,162,76,.14); border-bottom: 2px solid rgba(231,162,76,.4); font-weight: 800; }
    th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
    th.r, td.r { text-align: right; }
    td.r { white-space: nowrap; font-size: 12px; font-weight: 700; }  /* raqam ek hi line par: "1,100 Rs" */
    .cur { font-size: .6em; color: #b39258; font-weight: 600; margin-left: 1px; }
    th:nth-child(1), td:nth-child(1) { width: 15%; }
    th:nth-child(2), td:nth-child(2) { width: 31%; }
    th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { width: 18%; }
    td { padding: 9px 4px; border-bottom: 1px solid #f0e7d6; font-size: 12.5px; vertical-align: top; word-break: break-word; color: #33404d; }
    .debit { color: #c0392b; font-weight: 800; }
    .credit { color: #0f9d63; font-weight: 800; }
    tfoot td { font-weight: 900; border-top: 2px solid rgba(231,162,76,.5); font-size: 15px; padding-top: 12px; color: #2a2005; background: rgba(231,162,76,.08); }
    .toolbar {
      position: sticky; bottom: 0; background: #fffdf9; border-top: 1px solid #eaddc8;
      padding: 12px 16px; display: flex; gap: 10px; max-width: 720px; margin: 0 auto;
    }
    .toolbar button {
      flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 15px;
      font-weight: 800; cursor: pointer;
    }
    .btn-pdf { background: linear-gradient(180deg, #f8c471, #e7a24c); color: #3a2705;
      box-shadow: 0 5px 0 rgba(150,90,10,.4), 0 10px 20px rgba(231,162,76,.4), inset 0 1px 0 rgba(255,255,255,.6); }
    .btn-print { background: #efe4d2; color: #5a4a2a; box-shadow: inset 0 1px 0 rgba(255,255,255,.7); }
    .foot { text-align: center; color: #a98d5f; font-size: 12px; padding: 8px 24px 24px; }
    .error { padding: 60px 24px; text-align: center; color: #9a7b45; }
    .error .big { font-size: 48px; }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { max-width: 100%; box-shadow: none; }
      .header, .balance, .debit, .credit, th, tfoot td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { margin: 12mm; }
    }
  </style>
</head>
<body>
  <div class="sheet" id="sheet"></div>

  <script src="js/firebase-config.js"></script>
  <script>
    function decodeData(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const bin = atob(str);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }
    function fmtMoney(n) {
      const v = Math.abs(Math.round(n * 100) / 100);
      return 'Rs ' + v.toLocaleString('en-PK', { maximumFractionDigits: 2 });
    }
    // Table cells ke liye: "1,100 Rs" (number pehle, chhota Rs baad me, ek hi line)
    function fmtAmt(n) {
      const v = Math.abs(Math.round(n * 100) / 100);
      return v.toLocaleString('en-PK', { maximumFractionDigits: 2 }) + '<span class="cur">Rs</span>';
    }
    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function esc(s) {
      return (s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function norm(d) {
      if (d && d.v === 2) return {
        shop: d.s, shopPhone: d.sp, logo: d.lg, bl: d.bl, name: d.n, phone: d.p, balance: d.b,
        gen: d.g ? new Date(parseInt(d.g, 36) * 1000).toISOString() : new Date().toISOString(),
        txns: (d.t || []).map(a => ({ a: a[0], y: a[1] === 'd' ? 'debit' : 'credit', n: a[2], d: new Date(parseInt(a[3], 36) * 1000).toISOString() }))
      };
      return { shop: d.shop, shopPhone: d.shopPhone, logo: d.logo, bl: d.bl, name: d.name, phone: d.phone, balance: d.balance, gen: d.gen, txns: (d.txns || []).map(t => ({ a: t.a, y: t.y, n: t.n, d: t.d })) };
    }
    const sheet = document.getElementById('sheet');
    function showErr(msg, ic) {
      sheet.innerHTML = '<div class="error"><div class="big">' + (ic || '⚠️') + '</div><p>' + msg + '</p></div>';
    }
    function getParam(name) {
      try { const v = new URL(location.href).searchParams.get(name); if (v) return v; } catch (e) {}
      const mm = (location.hash || '').match(new RegExp('[#&]' + name + '=([^&]+)'));
      return mm ? decodeURIComponent(mm[1]) : null;
    }
    function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
    async function loadLive(token) {
      if (!window.FIREBASE_CONFIG) { showErr('Live hisaab abhi set nahi hua. Baraye meharbani sahib se naya link mangwayein.', '📄'); return; }
      showErr('Hisaab load ho raha hai…', '⏳');
      try {
        if (!(window.firebase && window.firebase.firestore)) {
          const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
          await loadScript(base + 'firebase-app-compat.js');
          await loadScript(base + 'firebase-firestore-compat.js');
        }
        firebase.apps.length ? firebase.app() : firebase.initializeApp(window.FIREBASE_CONFIG);
        // REALTIME: jaise hi hisaab update ho, khula hua link bhi foran naya dikhaye
        firebase.firestore().collection('share').doc(token).onSnapshot(function (doc) {
          if (!doc.exists || !doc.data().data) { showErr('Hisaab nahi mila. Naya link mangwayein.', '📄'); return; }
          let raw = doc.data().data;
          if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (e) {} }
          renderData(norm(raw));
        }, function () { showErr('Load nahi hua. Internet check karke dobara kholein.'); });
      } catch (e) { showErr('Load nahi hua. Internet check karke dobara kholein.'); }
    }
    function render() {
      const id = getParam('id');
      if (id) { loadLive(id); return; }
      const m = (location.hash || '').match(/[#&]d=([^&]+)/);
      if (!m) { showErr('Hisaab ka data nahi mila. Baraye meharbani sahi link kholein.', '📄'); return; }
      let data;
      try { data = norm(decodeData(decodeURIComponent(m[1]))); }
      catch (e) { showErr('Link kharab ho gaya lagta hai. Naya link mangwayein.'); return; }
      renderData(data);
    }
    function renderData(data) {
      const b = data.balance;
      const balCls = b > 0 ? 'pos' : b < 0 ? 'neg' : 'zero';
      const balTxtCls = b > 0 ? 'pos-t' : b < 0 ? 'neg-t' : 'zero-t';
      const balLbl = b > 0 ? 'Aap par baqi hai (Total Lena)'
                    : b < 0 ? 'Dukan ke zimmay hai' : 'Hisaab barabar hai';

      // Running balance chronological (purana->naya) compute karo, phir NAYA UPAR dikhane
      // ke liye rows ko ulta kar do (har row ka apna sahi baqaya rehta hai).
      let running = 0;
      const sorted = (data.txns || []).slice().sort((x, y) => new Date(x.d) - new Date(y.d));
      const rows = sorted.map(t => {
        const isDebit = t.y === 'debit';
        running += isDebit ? t.a : -t.a;
        return `<tr>
          <td>${fmtDate(t.d)}</td>
          <td>${esc(t.n) || (isDebit ? 'Maal Diya' : 'Paisay Milay')}</td>
          <td class="r ${isDebit ? 'debit' : ''}">${isDebit ? fmtAmt(t.a) : ''}</td>
          <td class="r ${!isDebit ? 'credit' : ''}">${!isDebit ? fmtAmt(t.a) : ''}</td>
          <td class="r">${fmtAmt(running)}</td>
        </tr>`;
      }).reverse().join('');

      document.title = 'Hisaab — ' + (data.name || '');

      const _hi = '<img class="logo" src="' + (data.logo || 'assets/logo.png') + '" alt="logo"><div class="htext"><div class="shop">' + esc(data.shop || 'Al Tariq Printers') + '</div><div class="sub">' + (data.shopPhone ? 'Rabta: ' + esc(data.shopPhone) : 'Hisaab / Ledger') + '</div></div>';
      const headerHtml = '<div class="header">' + (data.bl ? '<a href="' + esc(data.bl) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none">' + _hi + '</a>' : _hi) + '</div>';

      sheet.innerHTML = `
        ${headerHtml}
        <div class="meta">
          <div><span class="k">Customer:</span> <b>${esc(data.name)}</b></div>
          ${data.phone ? `<div><span class="k">Number:</span> ${esc(data.phone)}</div>` : ''}
          <div><span class="k">Tareekh:</span> ${fmtDate(data.gen || new Date().toISOString())}</div>
        </div>
        <div class="balance ${balCls}">
          <div class="lbl">${balLbl}</div>
          <div class="amt ${balTxtCls}">${fmtMoney(b)}</div>
        </div>
        <h3>Lein-Dein ki Tafseel</h3>
        <div class="ttbl"><table>
          <thead>
            <tr><th>Tareekh</th><th>Tafseel</th><th class="r">Maal</th><th class="r">Jama</th><th class="r">Baqaya</th></tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:24px;">Koi lein-dein nahi</td></tr>'}</tbody>
          <tfoot>
            <tr><td colspan="4">Total Baqaya</td><td class="r ${balTxtCls}">${fmtAmt(b)}</td></tr>
          </tfoot>
        </table></div>
        <div class="foot">Ye hisaab ${esc(data.shop || 'Al Tariq Printers')} ne bheja hai • ${fmtDate(data.gen || new Date().toISOString())}</div>
        <div class="toolbar">
          <button class="btn-pdf" onclick="window.print()">📄 PDF Download</button>
          <button class="btn-print" onclick="window.print()">🖨 Print</button>
        </div>
      `;
    }

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
